# ============================================================
# Nginx config — Moveo Transport B.V. static site
# ============================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    client_max_body_size 2m;

    # Gzip compressie — SEO + snelheid
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Clean URL rewrites ──────────────────────────────────
    # Verwijder trailing slash (behalve root /)
    rewrite ^(/[^.]+)/$ $1 permanent;

    # robots.txt & sitemap.xml niet cachen
    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache, must-revalidate";
        types { } default_type application/xml;
        try_files $uri =404;
    }

    # Let's Encrypt ACME HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root   /usr/share/nginx/html;
        allow  all;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Root exact serveren — voorkomt redirect loop via index directive
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # Redirect /index(.html) → / (voor wie het expliciet intikt)
    location ~ ^/index(\.html)?$ {
        return 301 /;
    }

    # Redirect *.html → clean URL (301 permanent)
    location ~ ^(.+)\.html$ {
        return 301 $1;
    }

    # Cache statics agressief (1 jaar)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Alle overige verzoeken: probeer exact bestand, dan .html variant
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri.html $uri/ =404;
    }

    # Verberg verborgen bestanden (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

